<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Calendar Widget</title>
  <style>
    /* 배경을 투명하게 설정하여 노션 배경색과 자연스럽게 어울리게 함 */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 정사각형 캘린더 카드 스타일 */
    .calendar-card {
      width: 160px;
      height: 160px;
      background-color: #ffffff;
      border-radius: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      border: 1px solid #ececec;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 상단 '월(Month)' 영역 */
    .calendar-header {
      background-color: #ff5a5f; /* 포인트 컬러 (원하는 색으로 변경 가능) */
      color: #ffffff;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* 하단 '일(Date)' & '요일(Day)' 영역 */
    .calendar-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
    }

    .date-number {
      font-size: 56px;
      font-weight: 800;
      color: #2f3437;
      line-height: 1;
      margin-bottom: 4px;
    }

    .day-name {
      font-size: 13px;
      font-weight: 600;
      color: #888888;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="calendar-card">
    <div class="calendar-header" id="month">NOV</div>
    <div class="calendar-body">
      <div class="date-number" id="date">18</div>
      <div class="day-name" id="day">WEDNESDAY</div>
    </div>
  </div>

  <script>
    function updateCalendar() {
      const now = new Date();
      
      // 월 이름 (영문 3글자 표기 - 한글로 바꾸려면 ['1월', '2월', ...] 로 수정)
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      // 요일 이름 (한글로 바꾸려면 ['일요일', '월요일', ...] 로 수정)
      const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];

      document.getElementById('month').textContent = months[now.getMonth()];
      document.getElementById('date').textContent = now.getDate();
      document.getElementById('day').textContent = days[now.getDay()];
    }

    // 페이지 로드 시 즉시 실행 및 1분마다 날짜 변경 체크
    updateCalendar();
    setInterval(updateCalendar, 60000);
  </script>

</body>
</html>
