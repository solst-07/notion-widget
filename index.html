<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Square Calendar</title>
  <style>
    :root {
      --header-bg: #c6def5;
      --body-bg: #ebf3fc;
      --accent-bg: #33332d;
      --text-main: #2c353d;
      --text-sub: #7a8694;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background-color: transparent;
      font-family: Georgia, "Times New Roman", Times, serif;
      overflow: hidden;
    }

    /* 210px의 아담하고 딱 떨어지는 정사각형 사이즈 고정 */
    .calendar-widget {
      position: relative;
      width: 210px;
      height: 210px;
      background-color: var(--body-bg);
      border-radius: 0px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 상단 헤더 */
    .calendar-header {
      background-color: var(--header-bg);
      height: 38px;
      padding: 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #5a6572;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    .nav-btn:hover {
      color: #1f2937;
    }

    .month-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* 달력 본문 */
    .calendar-body {
      flex: 1;
      padding: 8px 10px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .weekdays, .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .weekdays span {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .days-grid {
      flex: 1;
      align-items: center;
    }

    .day-cell {
      height: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      color: var(--text-main);
    }

    /* 오늘 날짜 강조 동그라미 */
    .day-cell.today span {
      background-color: var(--accent-bg);
      color: #ffffff;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 팔레트 버튼 */
    .theme-toggle-btn {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      font-size: 11px;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .calendar-widget:hover .theme-toggle-btn {
      opacity: 1;
    }

    /* 색상 설정 패널 */
    .theme-panel {
      position: absolute;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.97);
      padding: 12px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 10;
    }

    .theme-panel.active {
      display: flex;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #222;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      color: #666;
    }

    .color-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #444;
    }

    .color-row input[type="color"] {
      width: 28px;
      height: 18px;
      border: 1px solid #ddd;
      padding: 0;
      background: none;
      cursor: pointer;
    }

    .preset-row {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .preset-btn {
      width: 16px;
      height: 16px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    .reset-btn {
      width: 100%;
      padding: 4px;
      background-color: #f3f4f6;
      border: 1px solid #d1d5db;
      font-size: 10px;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="calendar-widget" id="widget">
    <div class="calendar-header">
      <button class="nav-btn" id="prevBtn">&#10094;</button>
      <div class="month-title" id="monthTitle">NOVEMBER</div>
      <button class="nav-btn" id="nextBtn">&#10095;</button>
    </div>

    <div class="calendar-body">
      <div class="weekdays">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </div>

    <button class="theme-toggle-btn" id="openThemeBtn" title="색상 변경">🎨</button>

    <div class="theme-panel" id="themePanel">
      <div class="panel-header">
        <span>색상 설정</span>
        <button class="close-btn" id="closeThemeBtn">&times;</button>
      </div>
      <div class="color-row">
        <label for="headerColor">헤더</label>
        <input type="color" id="headerColor" value="#c6def5">
      </div>
      <div class="color-row">
        <label for="bodyColor">배경</label>
        <input type="color" id="bodyColor" value="#ebf3fc">
      </div>
      <div class="color-row">
        <label for="accentColor">강조</label>
        <input type="color" id="accentColor" value="#33332d">
      </div>
      <div class="preset-row">
        <button class="preset-btn" style="background:#c6def5" data-h="#c6def5" data-b="#ebf3fc" data-a="#33332d"></button>
        <button class="preset-btn" style="background:#f5d0d6" data-h="#f5d0d6" data-b="#fdf2f4" data-a="#8a3b48"></button>
        <button class="preset-btn" style="background:#cde0d3" data-h="#cde0d3" data-b="#f2f7f4" data-a="#385443"></button>
        <button class="preset-btn" style="background:#e6dcc8" data-h="#e6dcc8" data-b="#f8f5ef" data-a="#5c4d3c"></button>
        <button class="preset-btn" style="background:#d9d9d9" data-h="#d9d9d9" data-b="#f5f5f5" data-a="#222222"></button>
      </div>
      <button class="reset-btn" id="resetThemeBtn">초기화</button>
    </div>
  </div>

  <script>
    const monthTitle = document.getElementById('monthTitle');
    const daysGrid = document.getElementById('daysGrid');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const monthNames = [
      "JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE",
      "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"
    ];

    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();

    function renderCalendar(year, month) {
      monthTitle.textContent = monthNames[month];
      daysGrid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.classList.add('day-cell');
        daysGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dayCell = document.createElement('div');
        dayCell.classList.add('day-cell');

        const span = document.createElement('span');
        span.textContent = day;
        dayCell.appendChild(span);

        if (
          year === today.getFullYear() &&
          month === today.getMonth() &&
          day === today.getDate()
        ) {
          dayCell.classList.add('today');
        }

        daysGrid.appendChild(dayCell);
      }
    }

    prevBtn.addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderCalendar(currentYear, currentMonth);
    });

    nextBtn.addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderCalendar(currentYear, currentMonth);
    });

    renderCalendar(currentYear, currentMonth);

    const root = document.documentElement;
    const openThemeBtn = document.getElementById('openThemeBtn');
    const closeThemeBtn = document.getElementById('closeThemeBtn');
    const themePanel = document.getElementById('themePanel');
    const headerInput = document.getElementById('headerColor');
    const bodyInput = document.getElementById('bodyColor');
    const accentInput = document.getElementById('accentColor');
    const resetThemeBtn = document.getElementById('resetThemeBtn');

    const defaultColors = { header: '#c6def5', body: '#ebf3fc', accent: '#33332d' };

    function applyColors(header, body, accent) {
      root.style.setProperty('--header-bg', header);
      root.style.setProperty('--body-bg', body);
      root.style.setProperty('--accent-bg', accent);
      headerInput.value = header;
      bodyInput.value = body;
      accentInput.value = accent;
      localStorage.setItem('notionCalTheme', JSON.stringify({ header, body, accent }));
    }

    const savedTheme = JSON.parse(localStorage.getItem('notionCalTheme'));
    if (savedTheme) {
      applyColors(savedTheme.header, savedTheme.body, savedTheme.accent);
    }

    openThemeBtn.addEventListener('click', () => themePanel.classList.add('active'));
    closeThemeBtn.addEventListener('click', () => themePanel.classList.remove('active'));

    headerInput.addEventListener('input', (e) => applyColors(e.target.value, bodyInput.value, accentInput.value));
    bodyInput.addEventListener('input', (e) => applyColors(headerInput.value, e.target.value, accentInput.value));
    accentInput.addEventListener('input', (e) => applyColors(headerInput.value, bodyInput.value, e.target.value));

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => applyColors(btn.dataset.h, btn.dataset.b, btn.dataset.a));
    });

    resetThemeBtn.addEventListener('click', () => {
      applyColors(defaultColors.header, defaultColors.body, defaultColors.accent);
    });
  </script>

</body>
</html>
